<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="930" viewBox="70 215 1160 930" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Astrivant mascot</title>
  <desc id="desc">A chamfered robot face with sage and dusty-blue outlines, two hollow ochre square eyes, a tilted square antenna, and asymmetric branching connections ending in hollow blue, sage, and muted-red nodes. Small gaps separate the connectors. All interiors are transparent.</desc>
  <g stroke="#8ca476" stroke-width="33" stroke-linecap="round" stroke-linejoin="round">
    <!-- Branches remain open at the nodes. -->
    <path d="M460 373 C469 423 544 397 543 475"/>
    <path d="M235 666 C302 674 326 718 354 771"/>
    <path d="M907 712 C936 615 987 548 1102 547"/>
    <path d="M1020 565 C1054 536 1065 498 1072 466"/>
    <path d="M454 935 C416 981 378 945 347 988"/>
    <path d="M407 997 C411 1013 417 1022 425 1028"/>
    <!-- Two staggered breaks keep the outer face light and graph-like. -->
    <path d="M518 499 H451 L356 594 V802 L451 901 H691 L756 836"/>
    <path d="M568 499 H810 L903 594 V628"/>
    <path d="M903 670 V802 L809 901 H737"/>
  </g>
  <g stroke="#728cb0" stroke-width="33" stroke-linecap="round" stroke-linejoin="round">
    <path d="M717 829 H462 L418 785 V636 L479 573 H782 L847 636 V794"/>
    <rect x="410" y="263" width="78" height="78" rx="12" transform="rotate(-9 449 302)"/>
    <circle cx="1087" cy="378" r="53"/>
    <circle cx="490" cy="1064" r="40"/>
  </g>
  <g stroke="#cca864" stroke-width="33" stroke-linejoin="round">
    <rect x="486" y="664" width="74" height="74" rx="9"/>
    <rect x="701" y="664" width="74" height="74" rx="9"/>
  </g>
  <g stroke="#b76a62" stroke-width="33">
    <circle cx="155" cy="667" r="43"/>
    <circle cx="1168" cy="544" r="29"/>
  </g>
  <circle cx="317" cy="1042" r="29" stroke="#8ca476" stroke-width="31"/>
</svg>
